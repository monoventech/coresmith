name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip, bcmath, gd, sqlite3, intl, redis
          coverage: none

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: ESLint
        run: bun run lint:check

      - name: Prettier
        run: bun run format:check

      - name: Tailwind canonical classes
        run: bun run lint:tailwind

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: ShellCheck
        run: bun run lint:sh

      - name: svelte-check
        run: bun run types:check

      - name: Build
        run: bun run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/build
          retention-days: 1

  tests:
    name: Feature tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip, bcmath, gd, sqlite3, intl, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan package:discover --ansi
          php artisan key:generate --force
          echo "CORESMITH_VAULT_KEY=$(openssl rand -base64 32)" >> .env

      - name: Run Pest
        run: php artisan test

  tests-pgsql:
    name: Feature tests on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: coresmith_test
          POSTGRES_USER: coresmith
          POSTGRES_PASSWORD: coresmith
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coresmith -d coresmith_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: coresmith_test
      DB_USERNAME: coresmith
      DB_PASSWORD: coresmith
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip, bcmath, gd, sqlite3, intl, redis, pdo_pgsql, pgsql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan package:discover --ansi
          php artisan key:generate --force
          echo "CORESMITH_VAULT_KEY=$(openssl rand -base64 32)" >> .env

      - name: Run Pest
        run: php artisan test

  tests-mysql:
    name: Feature tests on MySQL
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: coresmith_test
          MYSQL_USER: coresmith
          MYSQL_PASSWORD: coresmith
          MYSQL_ROOT_PASSWORD: coresmith
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysql -h 127.0.0.1 -u coresmith --password=coresmith -e 'select 1' coresmith_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: coresmith_test
      DB_USERNAME: coresmith
      DB_PASSWORD: coresmith
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip, bcmath, gd, sqlite3, intl, redis, pdo_mysql, mysqli
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan package:discover --ansi
          php artisan key:generate --force
          echo "CORESMITH_VAULT_KEY=$(openssl rand -base64 32)" >> .env

      - name: Run Pest
        run: php artisan test

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    needs: static
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, curl, zip, bcmath, gd, sqlite3, intl, redis
          coverage: none

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: public/build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Prepare environments
        run: |
          cp .env.example .env
          php artisan key:generate --force
          echo "CORESMITH_VAULT_KEY=$(openssl rand -base64 32)" >> .env
          touch database/e2e.sqlite database/e2e-install.sqlite database/e2e-cloud.sqlite
          bun run e2e:refresh
          bun run e2e:install-refresh
          bun run e2e:cloud-refresh

      - name: Run Playwright
        run: bun run test:e2e

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
